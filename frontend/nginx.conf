server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://hub-api:8000;
        proxy_set_header Host $http_host;
    }

    # NOTE: the umbrella PIN page is deliberately NOT proxied at a sub-path
    # here. Its own login/unlock routes are hardcoded absolute paths at its
    # own root (same reason movie-list-gate needs its own port, not a
    # sub-path -- see custom-domains/Caddyfile). The hidden footer link
    # instead points straight at its own port, set dynamically by
    # js/secret-entry.js so it resolves correctly whether this hub is viewed via localhost,
    # the Tailscale IP, or ohermes.duckdns.org.

    # Same paths this hub will eventually front once wired into the real
    # custom-domains Caddyfile -- proxied here too so local testing is a
    # faithful preview, not a partial one.
    location = /docs {
        return 301 $scheme://$http_host/docs/;
    }

    location /docs/ {
        proxy_pass http://host.docker.internal:8099/;
        proxy_set_header Host $http_host;
    }

    location /forgejo/ {
        proxy_pass http://host.docker.internal:3000/;
        proxy_set_header Host $http_host;
    }
}
