<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline — ohermes</title>
<meta name="description" content="Every listed project, in the order it was actually created.">
<link rel="stylesheet" href="css/style.css">
<style>
  .timeline-list { display: flex; flex-direction: column; gap: 0; }
  .timeline-row {
    display: grid; grid-template-columns: 110px 1fr; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .timeline-row time { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-dim); }
  .timeline-row a { color: var(--ink); text-decoration: none; font-weight: 600; }
  .timeline-row a:hover { color: var(--accent); }
  .timeline-row p { margin: 4px 0 0; color: var(--ink-dim); font-size: 0.88rem; }
  @media (max-width: 640px) { .timeline-row { grid-template-columns: 1fr; gap: 4px; } }
</style>
</head>
<body>

<div id="nav-slot"></div>

<section class="hero">
  <div class="wrap">
    <h1>Timeline</h1>
    <p>Every listed project, ordered by when it was actually created on GitHub. <span class="data-tag live">LIVE DATA</span></p>
  </div>
</section>

<section class="projects">
  <div class="wrap">
    <div class="timeline-list" id="timeline-list">
      <p class="empty-state">Loading…</p>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="js/partials.js"></script>
<script>
(function () {
  "use strict";
  function el(tag, opts) {
    var n = document.createElement(tag);
    if (opts && opts.text !== undefined) n.textContent = opts.text;
    if (opts && opts.className) n.className = opts.className;
    return n;
  }
  fetch("/api/projects").then(function (r) { return r.json(); }).then(function (data) {
    var projects = (data.projects || []).filter(function (p) { return p.created_at; });
    projects.sort(function (a, b) { return a.created_at < b.created_at ? 1 : -1; });
    var list = document.getElementById("timeline-list");
    list.textContent = "";
    if (!projects.length) {
      list.appendChild(el("p", { className: "empty-state", text: "No live data available right now." }));
      return;
    }
    projects.forEach(function (p) {
      var row = el("div", { className: "timeline-row" });
      var time = el("time", { text: p.created_at.slice(0, 10) });
      row.appendChild(time);
      var right = el("div");
      var a = el("a", { text: p.name });
      a.href = p.github_url; a.target = "_blank"; a.rel = "noopener noreferrer";
      right.appendChild(a);
      right.appendChild(el("p", { text: p.description }));
      row.appendChild(right);
      list.appendChild(row);
    });
  }).catch(function () {
    document.getElementById("timeline-list").textContent = "";
    document.getElementById("timeline-list").appendChild(
      el("p", { className: "empty-state", text: "Couldn't load the timeline right now." })
    );
  });
})();
</script>
</body>
</html>
