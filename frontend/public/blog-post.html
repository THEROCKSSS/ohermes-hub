<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — ohermes</title>
<link rel="stylesheet" href="css/style.css">
<style>
  article { max-width: 68ch; margin: 0 auto; padding: 40px 24px 60px; }
  article h1 { font-family: var(--font-mono); font-size: clamp(1.4rem, 4vw, 1.9rem); overflow-wrap: anywhere; }
  article p { color: var(--ink-dim); }
  article time { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-dim); }
</style>
</head>
<body>

<div id="nav-slot"></div>

<article id="post">
  <p class="empty-state">Loading…</p>
</article>

<div id="footer-slot"></div>

<script src="js/partials.js"></script>
<script>
(function () {
  "use strict";
  function el(tag, opts) {
    var n = document.createElement(tag);
    if (opts && opts.text !== undefined) n.textContent = opts.text;
    if (opts && opts.className) n.className = opts.className;
    return n;
  }
  var params = new URLSearchParams(window.location.search);
  var slug = params.get("slug");
  var article = document.getElementById("post");

  if (!slug) {
    article.textContent = "";
    article.appendChild(el("p", { className: "empty-state", text: "No post specified." }));
    return;
  }

  fetch("/api/blog/" + encodeURIComponent(slug))
    .then(function (r) {
      if (!r.ok) throw new Error("not found");
      return r.json();
    })
    .then(function (post) {
      document.title = post.title + " — ohermes blog";
      article.textContent = "";
      var time = el("time", { text: post.date });
      article.appendChild(time);
      article.appendChild(el("h1", { text: post.title }));
      // Body is plain text with blank-line paragraph breaks -- rendered as
      // separate <p> elements via textContent, never innerHTML, so nothing
      // in the stored content can ever be interpreted as HTML.
      (post.body || "").split("\n\n").forEach(function (para) {
        if (para.trim()) article.appendChild(el("p", { text: para }));
      });
    })
    .catch(function () {
      article.textContent = "";
      article.appendChild(el("p", { className: "empty-state", text: "Couldn't load that post." }));
    });
})();
</script>
</body>
</html>
